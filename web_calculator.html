<div style="font-family: var(--font-sans); padding: 2rem 0;">
  <div style="background: var(--surface-2); border-radius: 12px; border: 0.5px solid var(--border); padding: 1.5rem; max-width: 320px; margin: 0 auto;">
    <div id="display" style="background: var(--surface-0); border-radius: var(--radius); padding: 1rem; margin-bottom: 1.5rem; text-align: right; font-size: 32px; font-weight: 500; color: var(--text-primary); word-wrap: break-word; word-break: break-all; min-height: 50px; line-height: 1.2;">0</div>
    
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
      <button data-action="clear" style="grid-column: span 2; padding: 12px; background: var(--bg-danger); border: 0.5px solid var(--border-danger); border-radius: var(--radius); cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-danger); transition: background 0.15s;">AC</button>
      <button data-action="delete" style="padding: 12px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-primary); transition: background 0.15s;">⌫</button>
      <button data-op="/" style="padding: 12px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: 18px; font-weight: 500; color: var(--text-accent); transition: background 0.15s;">÷</button>
      
      <button data-num="7" style="padding: 12px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: 16px; font-weight: 500; color: var(--text-primary); transition: background 0.15s;">7</button>
      <button data-num="8" style="padding: 12px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: 16px; font-weight: 500; color: var(--text-primary); transition: background 0.15s;">8</button>
      <button data-num="9" style="padding: 12px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: 16px; font-weight: 500; color: var(--text-primary); transition: background 0.15s;">9</button>
      <button data-op="*" style="padding: 12px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: 18px; font-weight: 500; color: var(--text-accent); transition: background 0.15s;">×</button>
      
      <button data-num="4" style="padding: 12px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: 16px; font-weight: 500; color: var(--text-primary); transition: background 0.15s;">4</button>
      <button data-num="5" style="padding: 12px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: 16px; font-weight: 500; color: var(--text-primary); transition: background 0.15s;">5</button>
      <button data-num="6" style="padding: 12px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: 16px; font-weight: 500; color: var(--text-primary); transition: background 0.15s;">6</button>
      <button data-op="-" style="padding: 12px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: 18px; font-weight: 500; color: var(--text-accent); transition: background 0.15s;">−</button>
      
      <button data-num="1" style="padding: 12px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: 16px; font-weight: 500; color: var(--text-primary); transition: background 0.15s;">1</button>
      <button data-num="2" style="padding: 12px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: 16px; font-weight: 500; color: var(--text-primary); transition: background 0.15s;">2</button>
      <button data-num="3" style="padding: 12px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: 16px; font-weight: 500; color: var(--text-primary); transition: background 0.15s;">3</button>
      <button data-op="+" style="padding: 12px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: 18px; font-weight: 500; color: var(--text-accent); transition: background 0.15s;">+</button>
      
      <button data-num="0" style="grid-column: span 2; padding: 12px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: 16px; font-weight: 500; color: var(--text-primary); transition: background 0.15s;">0</button>
      <button data-num="." style="padding: 12px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); cursor: pointer; font-size: 18px; font-weight: 500; color: var(--text-primary); transition: background 0.15s;">.</button>
      <button data-action="equals" style="padding: 12px; background: var(--fill-accent); border: 0.5px solid var(--border-accent); border-radius: var(--radius); cursor: pointer; font-size: 18px; font-weight: 500; color: var(--on-accent); transition: background 0.15s;">=</button>
    </div>
  </div>
</div>

<script>
let display = document.getElementById('display');
let currentInput = '';
let operator = '';
let previousValue = '';
let shouldResetDisplay = false;

document.querySelectorAll('[data-num]').forEach(btn => {
  btn.addEventListener('click', () => {
    const num = btn.dataset.num;
    if (num === '.' && currentInput.includes('.')) return;
    if (shouldResetDisplay) {
      currentInput = num;
      shouldResetDisplay = false;
    } else {
      currentInput += num;
    }
    updateDisplay();
  });
});

document.querySelectorAll('[data-op]').forEach(btn => {
  btn.addEventListener('click', () => {
    const op = btn.dataset.op;
    if (currentInput === '' && previousValue === '') return;
    if (currentInput !== '') {
      if (previousValue !== '' && operator) {
        calculate();
      } else {
        previousValue = currentInput;
      }
      currentInput = '';
    }
    operator = op;
    shouldResetDisplay = false;
  });
});

document.querySelector('[data-action="clear"]').addEventListener('click', () => {
  currentInput = '';
  operator = '';
  previousValue = '';
  shouldResetDisplay = false;
  updateDisplay();
});

document.querySelector('[data-action="delete"]').addEventListener('click', () => {
  currentInput = currentInput.slice(0, -1);
  updateDisplay();
});

document.querySelector('[data-action="equals"]').addEventListener('click', () => {
  if (operator && previousValue !== '' && currentInput !== '') {
    calculate();
  }
});

function calculate() {
  let result = 0;
  const prev = parseFloat(previousValue);
  const curr = parseFloat(currentInput);
  
  if (operator === '+') result = prev + curr;
  else if (operator === '-') result = prev - curr;
  else if (operator === '*') result = prev * curr;
  else if (operator === '/') result = prev / curr;
  
  currentInput = Math.round(result * 100000000) / 100000000 + '';
  operator = '';
  previousValue = '';
  shouldResetDisplay = true;
  updateDisplay();
}

function updateDisplay() {
  display.textContent = currentInput || previousValue || '0';
}
</script>
